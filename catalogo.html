<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<meta name="description" content="Faça seu pedido online.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d1117;--panel:#151b26;--panel2:#1b2330;--line:#252d3d;
    --ink:#eef2f8;--muted:#9aa6bd;--brand:#7c5cff;--brand2:#9d84ff;
    --green:#25d366;--red:#f2607a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:90px}
  a{color:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  /* cabeçalho da loja */
  header.loja{background:linear-gradient(135deg,var(--brand),var(--brand2));padding:26px 16px 22px;text-align:center;position:relative}
  .logo{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:10px;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  header.loja h1{font-size:23px;margin-bottom:3px}
  header.loja .seg{font-size:13.5px;opacity:.92}
  header.loja .city{font-size:12.5px;opacity:.82;margin-top:2px}
  /* busca */
  .search{margin:16px 0}
  .search input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:15px;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--brand)}
  .cat{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 10px}
  /* grid produtos */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .prod{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .prod .ph{aspect-ratio:1/1;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:40px;color:#3a4458;overflow:hidden}
  .prod .ph img{width:100%;height:100%;object-fit:cover}
  .prod .info{padding:11px 12px 13px;display:flex;flex-direction:column;flex:1}
  .prod .nome{font-size:14.5px;font-weight:700;line-height:1.25;margin-bottom:3px}
  .prod .var{font-size:12px;color:var(--muted);margin-bottom:8px}
  .prod .precos{margin-top:auto;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .prod .preco{font-size:17px;font-weight:800;color:var(--brand2)}
  .prod .de{font-size:12.5px;color:var(--muted);text-decoration:line-through}
  .prod .add{margin-top:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;padding:10px;border-radius:10px;font-weight:800;font-size:13.5px;cursor:pointer;width:100%}
  .prod .add:active{transform:scale(.98)}
  /* stepper quando já no carrinho */
  .stepper{margin-top:10px;display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px}
  .stepper button{width:34px;height:34px;border-radius:8px;border:none;background:var(--brand);color:#fff;font-size:19px;font-weight:800;cursor:pointer;line-height:1}
  .stepper span{font-weight:800;font-size:15px}
  /* carrinho flutuante */
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--green);color:#06351b;display:none;align-items:center;justify-content:space-between;padding:14px 18px;font-weight:800;cursor:pointer;box-shadow:0 -6px 20px rgba(0,0,0,.35);z-index:40}
  .cartbar.show{display:flex}
  .cartbar .q{background:rgba(0,0,0,.18);border-radius:20px;padding:3px 11px;font-size:13.5px;margin-right:10px}
  .cartbar .tot{font-size:16px}
  .cartbar .go{display:flex;align-items:center;gap:7px}
  /* modal carrinho */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
  .sheet .shead{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .sheet .shead h2{font-size:18px}
  .sheet .shead .x{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .sheet .items{overflow:auto;padding:6px 18px}
  .ci{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
  .ci .cph{width:50px;height:50px;border-radius:10px;background:var(--panel2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
  .ci .cph img{width:100%;height:100%;object-fit:cover}
  .ci .cmid{flex:1;min-width:0}
  .ci .cn{font-size:14px;font-weight:700}
  .ci .cv{font-size:12px;color:var(--muted)}
  .ci .cp{font-size:13.5px;color:var(--brand2);font-weight:700;margin-top:2px}
  .ci .cst{display:flex;align-items:center;gap:8px}
  .ci .cst button{width:30px;height:30px;border-radius:8px;border:none;background:var(--panel2);color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}
  .ci .cst span{min-width:20px;text-align:center;font-weight:800}
  .sheet .foot{padding:14px 18px 18px;border-top:1px solid var(--line)}
  .sheet .foot label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;font-weight:600}
  .sheet .foot input,.sheet .foot textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:11px 12px;border-radius:10px;font-size:14.5px;font-family:inherit}
  .sheet .foot input:focus,.sheet .foot textarea:focus{outline:none;border-color:var(--brand)}
  .totrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px;font-size:18px;font-weight:800}
  .send{width:100%;margin-top:12px;background:var(--green);color:#06351b;border:none;padding:15px;border-radius:13px;font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
  .send:active{transform:scale(.99)}
  .hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.4}
  /* estados */
  .state{text-align:center;padding:60px 20px;color:var(--muted)}
  .state .big{font-size:46px;margin-bottom:12px}
  .state h2{color:var(--ink);font-size:19px;margin-bottom:6px}
  .ftr{text-align:center;color:var(--muted);font-size:12px;padding:26px 10px 10px}
  .ftr a{color:var(--brand2);font-weight:700;text-decoration:none}
</style>
</head>
<body>

<div id="app">
  <div class="state"><div class="big">⏳</div><h2>Carregando catálogo...</h2></div>
</div>

<!-- barra do carrinho -->
<div class="cartbar" id="cartbar" onclick="abrirCarrinho()">
  <span class="go">🛒 <span class="q" id="cartQ">0</span> Ver pedido</span>
  <span class="tot" id="cartTot">R$ 0,00</span>
</div>

<!-- modal carrinho -->
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharCarrinho()">
  <div class="sheet">
    <div class="shead"><h2>Seu pedido</h2><button class="x" onclick="fecharCarrinho()">×</button></div>
    <div class="items" id="cartItems"></div>
    <div class="foot">
      <label>Seu nome (opcional)</label>
      <input id="cliNome" placeholder="Pra loja saber quem é">
      <label>Observação / endereço de entrega (opcional)</label>
      <textarea id="cliObs" rows="2" placeholder="Ex: rua, nº, bairro — ou retirada no local"></textarea>
      <div class="totrow"><span>Total</span><span id="cartTot2">R$ 0,00</span></div>
      <button class="send" onclick="enviarPedido()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.588 5.303l-.999 3.648 3.91-1.026zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.297-.496.099-.199.05-.372-.025-.521-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
        Enviar pedido no WhatsApp
      </button>
      <div class="hint">O pedido vai direto pro WhatsApp da loja. Você combina pagamento e entrega por lá.</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://xgazzkhpxkbjrtvdblag.supabase.co';
const SUPABASE_ANON='sb_publishable_MffsIo5pQbuYeBZhzeg9hQ_23uZK5zP';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {auth:{persistSession:false}});
const $=id=>document.getElementById(id);

const EMOJI_SEG={'moda':'👗','vestuário':'👗','roupas':'👗','acessório':'👜','acessorios':'👜','lanchonete':'🍔','aliment':'🍔','distribuidora':'🚚','mercado':'🛒'};
function brl(v){return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function precoEfetivo(p){const promo=Number(p.preco_promo)||0;const base=Number(p.preco)||0;return (promo>0&&promo<base)?promo:base;}
function variacao(p){const a=[];if(p.tamanho)a.push(p.tamanho);if(p.cor)a.push(p.cor);return a.join(' · ');}
function emojiLoja(seg){seg=(seg||'').toLowerCase();for(const k in EMOJI_SEG){if(seg.includes(k))return EMOJI_SEG[k];}return '🛍️';}

let LOJA=null, PRODUTOS=[], CART={}; // CART: id -> qtd

function getSlug(){
  const p=new URLSearchParams(location.search).get('loja');
  if(p)return p.trim();
  // também aceita /catalogo/<slug> se configurado
  const m=location.pathname.match(/catalogo\/([^\/?#]+)/);
  return m?m[1]:'';
}

async function carregar(){
  const slug=getSlug();
  if(!slug){return erro('🔗','Link incompleto','Esse link não aponta pra nenhuma loja. Peça o link certo pra loja.');}
  let data,error;
  try{ ({data,error}=await sb.rpc('catalogo_loja',{p_slug:slug})); }
  catch(e){ return erro('⚠️','Ops','Não consegui carregar agora. Tente de novo em instantes.'); }
  if(error||!data||!data.loja){ return erro('🏪','Loja não encontrada','Confira o link com a loja.'); }
  LOJA=data.loja; PRODUTOS=data.produtos||[];
  document.title='Catálogo · '+LOJA.nome;
  if(LOJA.cor){try{document.documentElement.style.setProperty('--brand',LOJA.cor);document.documentElement.style.setProperty('--brand2',LOJA.cor);}catch(_){}}
  render();
}

function erro(big,titulo,txt){
  $('app').innerHTML='<div class="state"><div class="big">'+big+'</div><h2>'+titulo+'</h2><p>'+txt+'</p></div>';
}

function render(){
  const logo = LOJA.logo ? '<img src="'+esc(LOJA.logo)+'" alt="">' : emojiLoja(LOJA.segmento);
  let html='<header class="loja"><div class="logo">'+logo+'</div>'+
    '<h1>'+esc(LOJA.nome)+'</h1>'+
    (LOJA.segmento?'<div class="seg">'+esc(LOJA.segmento)+'</div>':'')+
    (LOJA.cidade?'<div class="city">📍 '+esc(LOJA.cidade)+'</div>':'')+
    '</header><div class="wrap">';

  if(!PRODUTOS.length){
    html+='<div class="state"><div class="big">🛒</div><h2>Catálogo em breve</h2><p>Essa loja ainda não publicou produtos. Fale direto com ela no WhatsApp.</p>'+
      (LOJA.whatsapp?'<p style="margin-top:14px"><a class="add" style="display:inline-block;width:auto;padding:12px 20px;text-decoration:none" href="'+waDireto()+'" target="_blank">💬 Falar no WhatsApp</a></p>':'')+'</div>';
    $('app').innerHTML=html+'</div>'+rodape();
    return;
  }

  html+='<div class="search"><input id="busca" placeholder="🔎 Buscar produto..." oninput="filtrar()"></div><div id="lista"></div>';
  $('app').innerHTML=html+'</div>'+rodape();
  desenharLista(PRODUTOS);
  atualizaCart();
}

function desenharLista(lista){
  if(!lista.length){$('lista').innerHTML='<div class="state"><p>Nenhum produto encontrado.</p></div>';return;}
  // agrupa por categoria
  const grupos={};
  lista.forEach(p=>{const c=p.categoria||'Produtos';(grupos[c]=grupos[c]||[]).push(p);});
  let html='';
  Object.keys(grupos).forEach(cat=>{
    html+='<div class="cat">'+esc(cat)+'</div><div class="grid">';
    grupos[cat].forEach(p=>{ html+=cardProduto(p); });
    html+='</div>';
  });
  $('lista').innerHTML=html;
}

function cardProduto(p){
  const pe=precoEfetivo(p);
  const base=Number(p.preco)||0;
  const temPromo=(Number(p.preco_promo)||0)>0 && Number(p.preco_promo)<base;
  const ph = p.foto ? '<img src="'+esc(p.foto)+'" alt="">' : '🛍️';
  const varz=variacao(p);
  return '<div class="prod" data-id="'+p.id+'">'+
    '<div class="ph">'+ph+'</div>'+
    '<div class="info">'+
      '<div class="nome">'+esc(p.nome)+'</div>'+
      (varz?'<div class="var">'+esc(varz)+'</div>':'<div class="var">&nbsp;</div>')+
      '<div class="precos"><span class="preco">'+brl(pe)+'</span>'+(temPromo?'<span class="de">'+brl(base)+'</span>':'')+'</div>'+
      '<div id="ctrl-'+p.id+'">'+controle(p.id)+'</div>'+
    '</div></div>';
}

function controle(id){
  const q=CART[id]||0;
  if(!q)return '<button class="add" onclick="addCart(\''+id+'\')">Adicionar</button>';
  return '<div class="stepper"><button onclick="menos(\''+id+'\')">−</button><span>'+q+'</span><button onclick="addCart(\''+id+'\')">+</button></div>';
}

function prodById(id){return PRODUTOS.find(p=>String(p.id)===String(id));}
function maxEst(id){const p=prodById(id);const e=Number(p&&p.estoque);return e>0?e:99;}

function addCart(id){
  const q=(CART[id]||0)+1;
  if(q>maxEst(id)){flash(id);return;}
  CART[id]=q; refreshCtrl(id); atualizaCart();
}
function menos(id){
  const q=(CART[id]||0)-1;
  if(q<=0)delete CART[id]; else CART[id]=q;
  refreshCtrl(id); atualizaCart();
  if($('cartItems') && $('overlay').classList.contains('show'))renderCartItems();
}
function flash(id){const el=document.querySelector('.prod[data-id="'+id+'"]');if(el){el.style.outline='2px solid var(--red)';setTimeout(()=>el.style.outline='',500);}}
function refreshCtrl(id){const c=$('ctrl-'+id);if(c)c.innerHTML=controle(id);}

function itensCart(){
  return Object.keys(CART).map(id=>{const p=prodById(id);if(!p)return null;const pe=precoEfetivo(p);return {p,q:CART[id],pe,sub:pe*CART[id]};}).filter(Boolean);
}
function totalCart(){return itensCart().reduce((s,i)=>s+i.sub,0);}
function qtdCart(){return Object.values(CART).reduce((s,q)=>s+q,0);}

function atualizaCart(){
  const q=qtdCart(),t=totalCart();
  $('cartQ').textContent=q;
  $('cartTot').textContent=brl(t);
  if($('cartTot2'))$('cartTot2').textContent=brl(t);
  $('cartbar').classList.toggle('show',q>0);
}

function abrirCarrinho(){renderCartItems();$('overlay').classList.add('show');}
function fecharCarrinho(){$('overlay').classList.remove('show');}

function renderCartItems(){
  const its=itensCart();
  if(!its.length){$('cartItems').innerHTML='<div class="state" style="padding:30px"><p>Seu pedido está vazio.</p></div>';atualizaCart();return;}
  let html='';
  its.forEach(({p,q,pe,sub})=>{
    const ph=p.foto?'<img src="'+esc(p.foto)+'" alt="">':'🛍️';
    const varz=variacao(p);
    html+='<div class="ci"><div class="cph">'+ph+'</div>'+
      '<div class="cmid"><div class="cn">'+esc(p.nome)+'</div>'+
      (varz?'<div class="cv">'+esc(varz)+'</div>':'')+
      '<div class="cp">'+brl(sub)+'</div></div>'+
      '<div class="cst"><button onclick="menos(\''+p.id+'\')">−</button><span>'+q+'</span><button onclick="addCart(\''+p.id+'\')">+</button></div>'+
      '</div>';
  });
  $('cartItems').innerHTML=html;
  atualizaCart();
}

function normZap(z){
  let d=(z||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.length<=11)d='55'+d; // adiciona DDI Brasil
  return d;
}
function waDireto(){
  const msg='Olá, '+LOJA.nome+'! Vim pelo catálogo online. 😊';
  return 'https://wa.me/'+normZap(LOJA.whatsapp)+'?text='+encodeURIComponent(msg);
}

function enviarPedido(){
  const its=itensCart();
  if(!its.length){abrirCarrinho();return;}
  const zap=normZap(LOJA.whatsapp);
  if(!zap){alert('Essa loja não cadastrou o WhatsApp. Fale com ela por outro meio.');return;}
  const nome=$('cliNome').value.trim();
  const obs=$('cliObs').value.trim();
  let m='Olá, *'+LOJA.nome+'*! Quero fazer um pedido:\n\n';
  its.forEach(({p,q,pe,sub})=>{
    const varz=variacao(p);
    m+='• '+q+'x '+p.nome+(varz?' ('+varz+')':'')+' — '+brl(sub)+'\n';
  });
  m+='\n*Total: '+brl(totalCart())+'*\n';
  if(nome)m+='\nNome: '+nome;
  if(obs)m+='\nObs: '+obs;
  const url='https://wa.me/'+zap+'?text='+encodeURIComponent(m);
  window.open(url,'_blank');
}

function filtrar(){
  const t=($('busca').value||'').toLowerCase().trim();
  if(!t){desenharLista(PRODUTOS);return;}
  const f=PRODUTOS.filter(p=>((p.nome||'')+' '+(p.categoria||'')+' '+(p.cor||'')+' '+(p.tamanho||'')+' '+(p.descricao||'')).toLowerCase().includes(t));
  desenharLista(f);
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rodape(){return '<div class="ftr">Vitrine online por <a href="https://jlgestao.pages.dev" target="_blank">JL Gestão</a></div>';}

carregar();
</script>
</body>
</html>
